<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <!-- City Skyline & Mortarboard Motif -->
  <g transform="translate(106, 106)" fill="#ffffff">
    <!-- Mortarboard Board -->
    <polygon points="150,40 270,90 150,140 30,90" />
    <!-- Tassel -->
    <path d="M220,103 L245,150 L255,155 L255,180" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" fill="none" stroke-linecap="round" />
    <circle cx="255" cy="190" r="14" />
    
    <!-- Symmetrical Academic Knowledge Columns representing specialized "Exam City" structures -->
    <rect x="65" y="150" width="30" height="110" rx="6" />
    <rect x="110" y="130" width="35" height="130" rx="6" />
    <rect x="155" y="110" width="40" height="150" rx="6" />
    <rect x="205" y="150" width="30" height="110" rx="6" />
    
    <!-- Accent core dots in the skyline -->
    <circle cx="80" cy="180" r="4" fill="#4f46e5" />
    <circle cx="127.5" cy="165" r="4.5" fill="#4f46e5" />
    <circle cx="175" cy="150" r="5" fill="#4f46e5" />
    <circle cx="175" cy="190" r="5" fill="#4f46e5" />
    <circle cx="220" cy="180" r="4" fill="#4f46e5" />
  </g>
</svg>
