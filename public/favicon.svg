<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Beautiful rounded accent background -->
  <rect width="512" height="512" rx="120" fill="url(#brand-grad)" />
  <!-- Academic Mortarboard and City Symmetrical Gateway Icon -->
  <g transform="translate(106, 110)" fill="#ffffff">
    <!-- Mortarboard Cap Diamond -->
    <polygon points="150,30 270,75 150,120 30,75" />
    <!-- Tassel string & fringe of graduation cap -->
    <path d="M210,88 L235,130 L242,135 L242,160" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" fill="none" stroke-linecap="round" />
    <circle cx="242" cy="170" r="10" />
    
    <!-- Exam City stylized columns representing testing towers and knowledge bricks -->
    <rect x="55" y="140" width="30" height="110" rx="6" />
    <rect x="100" y="115" width="35" height="135" rx="6" />
    <rect x="150" y="90" width="40" height="160" rx="6" />
    <rect x="200" y="115" width="35" height="135" rx="6" />
    <rect x="250" y="140" width="30" height="110" rx="6" />
  </g>
</svg>
